version: 2

before:
  hooks:
    - go mod download

builds:
  <- range .>
  - id: <.Name>
    main: cmd/<.Type>/<.Name>/main.go
    binary: <.Type>_<.Name>_{{ .Os }}_{{ .Arch }}

    no_unique_dist_dir: true
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    goarm:
      - 7
  <- end >

archives:
  <range .>    
  - id: <.Name>
    ids: [<.Name>]
    files:
      - none*
    name_template: "{{ .Binary }}"
  <end>

snapshot:
  version_template: 'v{{ .Version }}'

release:
  # If set to true, will not auto-publish the release.
  draft: true
  prerelease: auto

changelog:
  disable: true
